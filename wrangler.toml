# ===========================================================================
# Aduana IA — Configuración Cloudflare (Workers con Activos Estáticos + D1 + Workers AI + KV)
# ===========================================================================
name = "aduana-ia"
main = "functions/worker.ts"
compatibility_date = "2026-02-01"

[build]
command = "npm run build"

[assets]
directory = "./static"
not_found_handling = "single-page-application"

[vars]
ADUANA_EDGE_MODE = "cloudflare-pages"
WORKERS_AI_PRIMARY_MODEL = "@cf/meta/llama-3.2-3b-instruct"
WORKERS_AI_FALLBACK_MODEL = "@cf/zai-org/glm-4.7-flash"

[[d1_databases]]
binding = "DB"
database_name = "aduana-db"
database_id = "21eb0bb7-3d0f-4695-b450-3af441ab4d5b"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "KV"
id = "3885a09654fa42eea23241b0948b8df7"
