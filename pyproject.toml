[project]
name = "aduana-ia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "litestar>=2.10.0,<3.0.0",
    "msgspec>=0.18.6,<1.0.0",
    "granian>=1.6.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.1.0,<6.0.0"]
postgres = ["psycopg[binary]>=3.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: pruebas unitarias",
    "integration: pruebas de integración (API)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Prohibido random(): usar cálculo determinista (política de EXPLICA, CA-04)."

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104"]

[tool.mypy]
python_version = "3.11"
strict = true
